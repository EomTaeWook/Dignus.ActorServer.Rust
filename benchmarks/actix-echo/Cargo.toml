# Standalone (own workspace) so it stays out of the actor-core workspace.
[workspace]

[package]
name = "actix-echo"
version = "0.1.0"
edition = "2021"

[dependencies]
actix = "0.13"
tokio = { version = "1", features = ["net", "io-util", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

[[bin]]
name = "actix_echo_server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
